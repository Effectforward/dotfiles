[general]
live_config_reload = true
[window]
padding = { x = 5, y = 5 }
decorations = "None"
startup_mode = "Maximized"
opacity = 0.7
[scrolling]
history = 10000
multiplier = 3
[font]
size = 16

[font.normal]
family = "JetBrains Mono Nerd Font"
style = "Bold"

[font.bold]
family = "JetBrains Mono Nerd Font"
style = "ExtraBold"

[font.italic]
family = "JetBrains Mono Nerd Font"
style = "MediumItalic"

[font.bold_italic]
family = "JetBrains Mono Nerd Font"
style = "BoldItalic"
[cursor.style]
shape = "Block"
blinking = "Off"
[cursor]
blink_interval = 750
[selection]
save_to_clipboard = false
[terminal]
shell = { program = "/usr/bin/bash", args = ["-l"] }
[[keyboard.bindings]]
key = "Return"
mods = "Super|Shift"
action = "SpawnNewInstance"
[[mouse.bindings]]
action = "PasteSelection"
mouse = "Middle"
[colors]
transparent_background_colors = true
draw_bold_text_with_bright_colors = true
[env]
TERM = "xterm-256color"


