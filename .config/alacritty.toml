# GENERAL
[general]
# Enable auto‑reload when this file changes
live_config_reload = true

# WINDOW
[window]
padding = { x = 5, y = 5 }
decorations = "None"
startup_mode = "Maximized"
opacity = 1

blur = true

# SCROLLING
[scrolling]
history = 10000
multiplier = 3

# FONT
[font]
size = 17.0

[font.normal]
family = "JetBrains Mono Nerd Font"
style = "Bold"

[font.bold]
family = "JetBrains Mono Nerd Font"
style = "ExtraBold"

[font.italic]
family = "JetBrains Mono Nerd Font"
style = "MediumItalic"

[font.bold_italic]
family = "JetBrains Mono Nerd Font"
style = "BoldItalic"
# COLORS
[colors]

  # Primary (background / foreground)
  [colors.primary]
  background = "#11121D"
  foreground = "#a9b1d6"

  # Normal ANSI colors
  [colors.normal]
  black   = "#32344a"
  red     = "#f7768e"
  green   = "#9ece6a"
  yellow  = "#e0af68"
  blue    = "#7aa2f7"
  magenta = "#ad8ee6"
  cyan    = "#449dab"
  white   = "#787c99"

  # Bright ANSI colors
  [colors.bright]
  black   = "#444b6a"
  red     = "#ff7a93"
  green   = "#b9f27c"
  yellow  = "#ff9e64"
  blue    = "#7da6ff"
  magenta = "#bb9af7"
  cyan    = "#0db9d7"
  white   = "#acb0d0"


# CURSOR
[cursor.style]
shape = "Block"
blinking = "Off"

[cursor]
blink_interval = 750

# SELECTION
[selection]
save_to_clipboard = false

# TERMINAL (shell)
[terminal]
shell = { program = "/usr/bin/bash", args = ["-l"] }




# KEYBOARD BINDINGS
[[keyboard.bindings]]
key = "Return"
mods = "Super|Shift"
action = "SpawnNewInstance"

